<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天鳳 認定状ジェネレーター</title>
<meta name="description" content="Tenhou 認定状（昇段窗口）生成器：输入昵称、段位、日期，还原 tenhou.net 的「認定」窗口，支持官方 10 种语言、官方背景预设与自定义背景上传，可导出 PNG。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2311141b'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23f3e6c8' font-family='serif'%3E%E8%AA%8D%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --kai: "TenhouKai", "cwTeX Q Kai T", "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif;
    --bodyFont: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    --panel: rgba(23, 26, 33, 0.88);
    --line: #262b36;
    --line-2: #303747;
    --text: #e8ebf2;
    --muted: #8f97a8;
    --muted-2: #767e90;
    --gold: #e3bd6d;
    --gold-2: #c79a42;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 700px at 18% -12%, #1c2233 0%, rgba(28, 34, 51, 0) 60%),
      radial-gradient(900px 600px at 110% 10%, #241d14 0%, rgba(36, 29, 20, 0) 55%),
      #080a0e;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 1380px;
    margin: 0 auto;
    padding: 26px 24px 34px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brandMark {
    flex: none;
    font-family: var(--kai);
    font-size: 28px;
    line-height: 1;
    padding: 11px 13px 12px;
    border: 1px solid #3a4050;
    border-radius: 12px;
    background: linear-gradient(180deg, #1c202b, #11141b);
    color: #f3e6c8;
    letter-spacing: 0.06em;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
  }
  .brandText { min-width: 0; }
  .brandText h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brandText p {
    margin: 5px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .langPick {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .langPick select { width: auto; min-width: 9.5em; min-height: 34px; padding: 6px 10px; }
  main {
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .panel {
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 19px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
    scrollbar-width: thin;
    scrollbar-color: #333b4b transparent;
  }
  .panel h2 {
    margin: 0 0 2px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #7f8798;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > span { font-size: 12.5px; color: #aab2c3; }
  input, select, button { font: inherit; }
  input[type="text"], input[type="date"], select {
    width: 100%;
    min-height: 38px;
    padding: 9px 11px;
    border: 1px solid #2b3140;
    border-radius: 9px;
    background: #0d1016;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, input[type="date"]:focus, select:focus {
    border-color: #b98d3e;
    box-shadow: 0 0 0 3px rgba(185, 141, 62, 0.16);
  }
  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid #2b3140;
    border-radius: 9px;
    background: #0d1016;
  }
  .seg label { position: relative; flex: 1; }
  .seg input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .seg span {
    display: block;
    padding: 7px 8px;
    border-radius: 6px;
    text-align: center;
    font-size: 13px;
    color: #98a1b3;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .seg input:checked + span {
    background: #262c39;
    color: #fff;
    box-shadow: inset 0 0 0 1px #3a4152;
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 42px;
    height: 31px;
    padding: 0;
    border: 1px solid #3a4152;
    border-radius: 7px;
    background-color: #000;
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: outline 0.12s, border-color 0.12s, transform 0.05s;
  }
  .swatch:active { transform: translateY(1px); }
  .swatch.active { outline: 2px solid var(--gold); outline-offset: 2px; border-color: transparent; }
  .swatch-none { background: #000; box-shadow: inset 0 0 0 1px #2b3140; }
  .bgActions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mini {
    padding: 6px 10px;
    border: 1px solid #303747;
    border-radius: 8px;
    background: #1a1f29;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .mini:hover { background: #222838; }
  .mini.active { border-color: #b98d3e; box-shadow: inset 0 0 0 1px #b98d3e; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aab2c3; cursor: pointer; }
  .chk input { accent-color: #c79a42; width: 14px; height: 14px; }
  .bgName {
    font-size: 11.5px;
    line-height: 1.5;
    color: #7f8798;
    word-break: break-all;
  }
  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line-2);
    border-radius: 10px;
    background: #1a1f29;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, filter 0.15s, transform 0.05s;
  }
  .btn:hover { background: #222838; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(180deg, var(--gold), var(--gold-2));
    border-color: #8d6a26;
    color: #1a1305;
    font-weight: 650;
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.5; cursor: wait; filter: none; }
  .note { margin: 0; font-size: 11.5px; line-height: 1.65; color: var(--muted-2); }
  .preview { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .previewHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9aa3b5;
  }
  .pill {
    padding: 4px 10px;
    border: 1px solid #2a3040;
    border-radius: 999px;
    background: #161a23;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: none;
    color: var(--muted);
  }
  .stageWrap {
    padding: 14px;
    border: 1px solid #242936;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(22, 25, 32, 0.9), rgba(12, 14, 19, 0.9));
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 10px;
    background-color: #000;
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    box-shadow: inset 0 0 0 1px #1b1f27, 0 20px 60px rgba(0, 0, 0, 0.55);
  }
  .cert {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    color: #fff;
    text-align: center;
    font-family: var(--bodyFont);
    line-height: 1;
    opacity: 0;
    will-change: opacity;
  }
  .cert.style-v4 {
    padding: 1em 0;
    border: 1px solid #444;
    background: rgba(0, 0, 0, 0.90);
    min-width: 70%;
  }
  .cert.style-v3 {
    padding: 1em 0.5em;
    border: 1px solid #444;
    background: rgba(0, 0, 0, 0.85);
  }
  .cert .title {
    font-family: var(--kai);
    font-size: 400%;
    font-weight: 400;
    line-height: 1;
  }
  .cert .bodyWrap { margin: 0; }
  .cert.style-v4 .bodyWrap { margin: 2em 0.5em 1em; }
  .cert .bodyText {
    display: inline-block;
    margin: 1em 0;
    vertical-align: top;
    text-align: left;
  }
  .cert .line {
    height: 1em;
    line-height: 1;
    white-space: pre;
  }
  .cert .ok { margin: 0; font-family: var(--bodyFont); white-space: nowrap; cursor: default; }
  .cert.style-v4 .ok {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 8em;
    height: 3em;
    font-size: 1em;
    border: 1px solid #444;
    color: #fff;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.7) 0%,
      rgba(107, 107, 107, 0.5) 50%,
      rgba(31, 31, 31, 0.5) 50%,
      rgba(0, 0, 0, 0.7) 100%
    );
    text-shadow: #000 -0.03em -0.03em 0, #000 -0.03em 0.03em 0, #000 0.03em -0.03em 0,
      #000 0.06em 0.06em 0;
  }
  .cert.style-v3 .ok {
    height: 2em;
    font-size: 175%;
    padding: 0 2em;
    border: 1px solid #444;
    color: #fff;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.4) 0%,
      rgba(167, 147, 127, 0.4) 50%,
      rgba(31, 31, 31, 0.4) 51%,
      rgba(0, 0, 0, 0.4) 100%
    );
  }
  .hint { margin: 0; font-size: 11.5px; color: var(--muted-2); }
  footer {
    padding-top: 15px;
    border-top: 1px solid #1e232d;
    font-size: 11.5px;
    color: #666f80;
    line-height: 1.6;
  }
  @media (max-width: 940px) {
    main { grid-template-columns: 1fr; }
    .panel { position: static; max-height: none; overflow: visible; }
    .brandText p { display: none; }
  }
  @media (max-width: 560px) {
    .app { padding: 18px 14px 26px; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brandMark">認定</span>
      <div class="brandText">
        <h1 id="appTitle">天鳳 認定状ジェネレーター</h1>
        <p id="appSub">tenhou.net の「認定」昇段ウィンドウを再現</p>
      </div>
    </div>
    <label class="langPick">
      <span id="langLabel">言語</span>
      <select id="langSelect" aria-label="Language"></select>
    </label>
  </header>

  <main>
    <section class="panel" aria-labelledby="ctrlTitle">
      <h2 id="ctrlTitle">設定</h2>

      <label class="field">
        <span id="lblName">名前</span>
        <input id="nameInput" type="text" maxlength="24" autocomplete="off" spellcheck="false" value="NoName" />
      </label>

      <div class="field">
        <span id="lblRank">段位</span>
        <input id="rankInput" type="text" list="rankList" maxlength="48" autocomplete="off" spellcheck="false" />
        <datalist id="rankList"></datalist>
        <p class="note" id="rankNote"></p>
      </div>

      <label class="field">
        <span id="lblDate">日付</span>
        <input id="dateInput" type="date" />
      </label>

      <div class="field">
        <span id="lblMode">対局</span>
        <div class="seg" role="radiogroup" aria-labelledby="lblMode">
          <label>
            <input type="radio" name="mode" value="four" checked />
            <span id="lblFour">四麻</span>
          </label>
          <label>
            <input type="radio" name="mode" value="three" />
            <span id="lblThree">三麻</span>
          </label>
        </div>
      </div>

      <label class="field">
        <span id="lblStyle">クライアント</span>
        <select id="styleSelect">
          <option value="v4" id="optV4">/4/</option>
          <option value="v3" id="optV3">/3/</option>
        </select>
      </label>

      <div class="field">
        <span id="lblBackground">背景</span>
        <div class="swatches" id="swatches"></div>
        <div class="bgActions">
          <button id="uploadBgBtn" class="mini" type="button">画像をアップロード</button>
          <button id="resetBgBtn" class="mini" type="button">初期化</button>
          <label class="chk">
            <input type="checkbox" id="vignetteChk" checked />
            <span id="lblVignette">ビネット</span>
          </label>
        </div>
        <input type="file" id="bgFile" accept="image/*" hidden />
        <div class="bgName" id="bgName"></div>
        <p class="note" id="bgNote"></p>
      </div>

      <div class="actions">
        <button id="replayBtn" class="btn ghost" type="button">アニメを再生</button>
        <button id="exportBtn" class="btn primary" type="button">PNG 書き出し</button>
      </div>

      <p class="note" id="note"></p>
    </section>

    <section class="preview">
      <div class="previewHead">
        <span id="lblPreview">プレビュー</span>
        <span class="pill" id="fadeHint">3.0s fade-in</span>
      </div>
      <div class="stageWrap">
        <div class="stage" id="stage">
          <div class="cert style-v4" id="cert">
            <div class="title" id="certTitle">認定</div>
            <div class="bodyWrap"><div class="bodyText" id="certBody"></div></div>
            <button class="ok" id="certOk" type="button" tabindex="-1">OK</button>
          </div>
        </div>
      </div>
      <p class="hint" id="exportHint"></p>
    </section>
  </main>

  <footer id="disclaimer"></footer>
</div>

<script>

      var b = a.I, k = a.J, d = a.Y;
      b[1] = Math.trunc(2360 * b[0] / 31 / 56);
      d[0] = d[1] = d[4] = Math.min(Math.trunc(12 * b[0] / 31), Math.trunc(12 * b[1] / 40));
      k[0] = k[4] = Math.trunc(47 * b[0] / 31) - d[0];
      k[1] = Math.trunc(37 * b[1] / 40) - d[1];
      if (b[4] !== b[0]) {
        d[4] = Math.trunc(12 * b[4] / 31);
        k[4] = Math.trunc(47 * b[4] / 31) - d[4];
      }
      b[2] = b[6] = b[0]; d[2] = d[6] = d[0]; k[2] = k[6] = k[0];
      b[3] = b[1]; d[3] = d[1]; k[3] = k[1];
      b[5] = b[7] = Math.trunc(380 * k[1] / 460);
      d[5] = d[7] = Math.trunc(44 * b[5] / 19) - k[1];
      k[5] = k[7] = k[1];
      var h = 2 * k[1], n = 2 * b[0];
      f = m = 0;
      if (HCA === 1 || HCA === 3) {
        f = Math.max(f, n + 17 * b[0] + 2 * b[1] + n);
        m = Math.max(m, h + 17 * k[1] + 2 * k[0] + d[0] + k[4] + d[4] + (E ? k[1] : 0));
      } else {
        f = Math.max(f, n + 3 * b[1] + 6 * b[0] + 3 * b[1] + n);
        m = Math.max(m, h + 3 * k[0] + 6 * k[1] + 3 * k[0] + d[0] + k[4] + d[4] + (E ? k[1] : 0));
      }
      f = Math.max(f, Math.trunc(14.1 * b[4]) + b[0]);
      a.zd = k[7] + d[7] - (k[3] + d[3]);
      m = Math.max(m, Math.trunc(2.1 * k[1]) + a.zd + 4 * (2 * k[1] + k[0]) + k[1] + d[1] + k[4] + d[4]);
      m = Math.max(m, k[0] + 4 * (2 * k[1] + k[0]) + Math.trunc(2.1 * k[1]) + a.zd + 2 * k[1] + d[1] + (E ? k[1] : 0));
      return f <= boardW && m <= boardH;
    }
    var b = a.I, k = a.J, d = a.Y;
    for (b[0] = 200; b[0] > 10; --b[0]) {
      b[4] = Math.trunc(31 * (2 * k[1] + d[0]) / 47);
      if (c()) break;
      b[4] = Math.trunc((boardW - b[0]) / 14.1);
      if (c()) break;
    }
    b[4] = Math.trunc((boardW - b[0]) / 14.1);
    for (b[4] = Math.min(b[4], Math.trunc(1.7 * b[0])); b[4] > 10 && !c(); --b[4]) { /* shrink */ }
    if (boardH - m < boardW - f) m = Math.trunc(boardH);
    else f = Math.trunc(boardW);
    return { playW: f, playH: m, inset: a.I[1] };
  }

  function computeLayout(stageW, stageH, text) {
    var v4 = state.style === "v4";
    var em, cardW, contentW, maxLine, bodyW, lines, titleH, titleMt, titleMb, wrapMt;
    var innerMt, innerMb, wrapMb, buttonH, bodyH, bodyTop, buttonTop, cardH;
    var rawLines = text.split("\n");
    var bodyFont;

    if (v4) {
      em = stageW * 0.02;
      cardW = stageW * 0.70;
      contentW = Math.max(cardW - em - 2, em * 4);
      bodyFont = em + "px " + BODY_FONT;
      maxLine = 0;
      rawLines.forEach(function (line) { maxLine = Math.max(maxLine, measure(line, bodyFont)); });
      bodyW = Math.min(maxLine, contentW);
      lines = wrapAll(rawLines, bodyW, bodyFont);
      titleH = 4 * em;
      titleMt = 2 * em;
      titleMb = 3 * em;
      wrapMt = 2 * em;
      innerMt = em;
      innerMb = em;
      wrapMb = em;
      buttonH = 3 * em;
      bodyH = lines.length * em;
      bodyTop = em + titleMt + titleH + Math.max(titleMb, wrapMt) + innerMt;
      buttonTop = bodyTop + bodyH + innerMb + wrapMb;
      cardH = buttonTop + buttonH + em + 2;
    } else {
      var geo = computeV3Geometry(stageW, stageH);
      cardW = geo.playW - 2 * geo.inset;
      em = cardW / 30;
      contentW = Math.max(cardW - em - 2, em * 4);
      bodyFont = em + "px " + BODY_FONT;
      maxLine = 0;
      rawLines.forEach(function (line) { maxLine = Math.max(maxLine, measure(line, bodyFont)); });
      bodyW = Math.min(maxLine, contentW);
      lines = wrapAll(rawLines, bodyW, bodyFont);
      titleH = 4 * em;
      titleMt = 0;
      titleMb = 0;
      wrapMt = 0;
      innerMt = em;
      innerMb = em;
      wrapMb = 0;
      buttonH = 3.5 * em;
      bodyH = lines.length * em;
      bodyTop = em + titleH + innerMt;
      buttonTop = bodyTop + bodyH + innerMb;
      cardH = buttonTop + buttonH + em + 2;
    }

    return {
      em: em, v4: v4, cardW: cardW, cardH: cardH, bodyW: bodyW, maxLine: maxLine,
      lines: lines, padT: em, titleMt: titleMt, titleH: titleH,
      bodyTop: bodyTop, buttonH: buttonH, buttonTop: buttonTop,
      titleMb: titleMb
    };
  }

  function wrapAll(rawLines, bodyW, bodyFont) {
    var lines = [];
    rawLines.forEach(function (line) {
      if (!line) { lines.push(""); return; }
      wrapLine(line, bodyW, bodyFont).forEach(function (l) { lines.push(l); });
    });
    return lines;
  }

  function presetUrl(code) {
    return BG_BASE_PREFIX + code + ".jpg";
  }

  function renderCert() {
    var text = currentText();
    var stageW = stage.clientWidth || 800;
    var stageH = stage.clientHeight || stageW * 0.75;
    var L = computeLayout(stageW, stageH, text);

    cert.className = "cert " + (L.v4 ? "style-v4" : "style-v3");
    cert.style.fontSize = L.em + "px";
    cert.style.width = L.cardW + "px";

    var title = document.querySelector(".cert .title");
    title.style.margin = L.v4 ? (2 * L.em) + "px 0 " + (3 * L.em) + "px" : "0";

    certBody.style.width = L.bodyW + "px";
    certBody.replaceChildren();
    L.lines.forEach(function (line) {
      var div = document.createElement("div");
      div.className = "line";
      div.textContent = line;
      certBody.appendChild(div);
    });
  }

  function playFade() {
    cert.style.transition = "none";
    cert.style.opacity = "0";
    void cert.offsetWidth;
    requestAnimationFrame(function () {
      cert.style.transition = "opacity " + FADE_MS + "ms ease-out";
      cert.style.opacity = "1";
    });
  }

  function showInstant() {
    cert.style.transition = "none";
    cert.style.opacity = "1";
  }

  function applyUI() {
    document.documentElement.lang = state.lang;
    document.title = t("appTitle");
    $("appTitle").textContent = t("appTitle");
    $("appSub").textContent = t("appSub");
    $("ctrlTitle").textContent = t("controls");
    $("lblName").textContent = t("name");
    $("lblRank").textContent = t("rank");
    $("lblDate").textContent = t("date");
    $("lblMode").textContent = t("mode");
    $("lblFour").textContent = t("four");
    $("lblThree").textContent = t("three");
    $("lblStyle").textContent = t("style");
    $("optV4").textContent = t("styleV4");
    $("optV3").textContent = t("styleV3");
    $("langLabel").textContent = t("language");
    $("replayBtn").textContent = t("replay");
    $("exportBtn").textContent = t("export");
    $("lblPreview").textContent = t("preview");
    $("fadeHint").textContent = t("fadeHint");
    $("exportHint").textContent = t("exportHint");
    $("note").textContent = t("note");
    $("disclaimer").textContent = t("disclaimer");
    $("nameInput").placeholder = t("namePh");

    $("lblBackground").textContent = t("background");
    $("lblVignette").textContent = t("vignette");
    $("uploadBgBtn").textContent = t("upload");
    $("resetBgBtn").textContent = t("resetBg");
    $("bgNote").textContent = t("bgNote");
    $("rankNote").textContent = t("rankNote");
    $("rankInput").placeholder = t("rankPh");

    $("langSelect").value = state.lang;
    rebuildRankList();
    buildSwatches();
    updateBgName();
  }

  function rebuildRankList() {
    var list = $("rankList");
    var showHint = state.lang !== "ja" && state.lang !== "zh";
    list.replaceChildren();
    RANKS.forEach(function (rank, i) {
      var opt = document.createElement("option");
      opt.value = rank;
      if (showHint) opt.label = RANK_HINTS[i];
      list.appendChild(opt);
    });
  }

  function buildSwatches() {
    var wrap = $("swatches");
    wrap.replaceChildren();
    BG_PRESETS.forEach(function (p, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "swatch";
      btn.dataset.code = p.code;
      btn.style.backgroundImage = 'url("' + presetUrl(p.code) + '")';
      btn.title = colorName(p.color);
      btn.setAttribute("aria-label", colorName(p.color));
      btn.addEventListener("click", function () {
        state.bgMode = "preset";
        state.bgPreset = p.code;
        updateSwatchState();
        updateStageBg();
        updateBgName();
      });
      wrap.appendChild(btn);
    });

    var none = document.createElement("button");
    none.type = "button";
    none.className = "swatch swatch-none";
    none.dataset.code = "none";
    none.title = t("noneColor");
    none.setAttribute("aria-label", t("noneColor"));
    none.addEventListener("click", function () {
      state.bgMode = "none";
      updateSwatchState();
      updateStageBg();
      updateBgName();
    });
    wrap.appendChild(none);

    if (state.customBg) {
      var custom = document.createElement("button");
      custom.type = "button";
      custom.className = "swatch";
      custom.dataset.code = "custom";
      custom.style.backgroundImage = 'url("' + state.customBg.url + '")';
      custom.title = t("custom");
      custom.setAttribute("aria-label", t("custom"));
      custom.addEventListener("click", function () {
        state.bgMode = "custom";
        updateSwatchState();
        updateStageBg();
        updateBgName();
      });
      wrap.appendChild(custom);
    }

    updateSwatchState();
  }

  function updateSwatchState() {
    var nodes = $("swatches").querySelectorAll(".swatch");
    Array.prototype.forEach.call(nodes, function (el) {
      var code = el.dataset.code;
      var active = false;
      if (code === "none") active = state.bgMode === "none";
      else if (code === "custom") active = state.bgMode === "custom";
      else active = state.bgMode === "preset" && state.bgPreset === code;
      el.classList.toggle("active", active);
    });
    $("uploadBgBtn").classList.toggle("active", state.bgMode === "custom");

    // 语言切换后更新颜色提示
    var presets = $("swatches").querySelectorAll(".swatch[data-code]");
    Array.prototype.forEach.call(presets, function (el, i) {
      if (i < BG_PRESETS.length) {
        var p = BG_PRESETS[i];
        el.title = colorName(p.color);
        el.setAttribute("aria-label", colorName(p.color));
      }
    });
  }

  function updateStageBg() {
    var base = null;
    if (state.bgMode === "custom" && state.customBg) base = state.customBg.url;
    else if (state.bgMode === "preset") base = presetUrl(state.bgPreset);
    if (!base) {
      stage.style.backgroundImage = "none";
      stage.style.backgroundColor = "#000";
      return;
    }
    var layers = [];
    if (state.vignette) layers.push('url("' + VIGNETTE_URL + '")');
    layers.push('url("' + base + '")');
    stage.style.backgroundImage = layers.join(",");
    stage.style.backgroundSize = layers.map(function () { return "cover"; }).join(",");
    stage.style.backgroundPosition = layers.map(function () { return "center center"; }).join(",");
    stage.style.backgroundRepeat = layers.map(function () { return "no-repeat"; }).join(",");
    stage.style.backgroundColor = "#000";
  }

  function updateBgName() {
    var el = $("bgName");
    if (state.bgMode === "none") {
      el.textContent = t("noneColor");
    } else if (state.bgMode === "custom" && state.customBg) {
      el.textContent = t("custom") + " · " + state.customBg.name;
    } else {
      var idx = -1;
      BG_PRESETS.forEach(function (p, i) { if (p.code === state.bgPreset) idx = i; });
      el.textContent = t("tenhouPreset") + (idx >= 0 ? " · " + colorName(idx) : "");
    }
  }

  function loadImage(url, useCors) {
    if (imgCache.has(url)) return imgCache.get(url);
    var p = new Promise(function (resolve, reject) {
      var img = new Image();
      if (useCors) img.crossOrigin = "anonymous";
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("image load failed")); };
      img.src = url;
    });
    imgCache.set(url, p);
    return p;
  }

  function getBgImages() {
    var baseP = null;
    var vigP = null;
    if (state.bgMode === "custom" && state.customBg) {
      baseP = Promise.resolve(state.customBg.img);
    } else if (state.bgMode === "preset") {
      baseP = loadImage(presetUrl(state.bgPreset), true);
    }
    if (state.vignette && state.bgMode !== "none") {
      vigP = loadImage(VIGNETTE_URL, true);
    }
    return Promise.all([
      baseP ? baseP.catch(function () { return null; }) : Promise.resolve(null),
      vigP ? vigP.catch(function () { return null; }) : Promise.resolve(null)
    ]).then(function (arr) {
      return { base: arr[0], vig: arr[1] };
    });
  }

  function drawCover(ctx, img, W, H) {
    var iw = img.naturalWidth || img.width;
    var ih = img.naturalHeight || img.height;
    if (!iw || !ih) return;
    var s = Math.max(W / iw, H / ih);
    var w = iw * s;
    var h = ih * s;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }

  function download(blob, filename) {
    var a = document.createElement("a");
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function drawCert(ctx, W, H, L) {
    var em = L.em;
    var v4 = L.v4;
    var cardX = (W - L.cardW) / 2;
    var cardY = (H - L.cardH) / 2;
    var border = 1;

    ctx.fillStyle = v4 ? "rgba(0,0,0,0.90)" : "rgba(0,0,0,0.85)";
    ctx.fillRect(cardX, cardY, L.cardW, L.cardH);
    ctx.strokeStyle = "#444";
    ctx.lineWidth = border;
    ctx.strokeRect(cardX + 0.5, cardY + 0.5, L.cardW - 1, L.cardH - 1);

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = 4 * em + "px " + TITLE_FONT;
    var titleY = cardY + border + L.padT + L.titleMt + L.titleH / 2;
    ctx.fillText("認定", cardX + L.cardW / 2, titleY);

    ctx.font = em + "px " + BODY_FONT;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    var bodyX = cardX + (L.cardW - L.bodyW) / 2;
    var y = cardY + border + L.bodyTop;
    L.lines.forEach(function (line) {
      if (line) ctx.fillText(line, bodyX, y + em / 2);
      y += em;
    });

    var btnY = cardY + border + L.buttonTop;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (v4) {
      var btnW = 8 * em;
      var btnX = cardX + (L.cardW - btnW) / 2;
      var grad = ctx.createLinearGradient(0, btnY, 0, btnY + L.buttonH);
      grad.addColorStop(0, "rgba(0,0,0,0.7)");
      grad.addColorStop(0.5, "rgba(107,107,107,0.5)");
      grad.addColorStop(0.5, "rgba(31,31,31,0.5)");
      grad.addColorStop(1, "rgba(0,0,0,0.7)");
      ctx.fillStyle = grad;
      ctx.fillRect(btnX, btnY, btnW, L.buttonH);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      ctx.strokeRect(btnX + 0.5, btnY + 0.5, btnW - 1, L.buttonH - 1);
      ctx.font = em + "px " + BODY_FONT;
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#000";
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 1;
      ctx.shadowBlur = 1;
      ctx.fillText("OK", btnX + btnW / 2, btnY + L.buttonH / 2);
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    } else {
      var btnFont = 1.75 * em;
      var btnW2 = measure("OK", btnFont + "px " + BODY_FONT) + 7 * em;
      var btnX2 = cardX + (L.cardW - btnW2) / 2;
      var grad2 = ctx.createLinearGradient(0, btnY, 0, btnY + L.buttonH);
      grad2.addColorStop(0, "rgba(0,0,0,0.4)");
      grad2.addColorStop(0.5, "rgba(167,147,127,0.4)");
      grad2.addColorStop(0.51, "rgba(31,31,31,0.4)");
      grad2.addColorStop(1, "rgba(0,0,0,0.4)");
      ctx.fillStyle = grad2;
      ctx.fillRect(btnX2, btnY, btnW2, L.buttonH);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      ctx.strokeRect(btnX2 + 0.5, btnY + 0.5, btnW2 - 1, L.buttonH - 1);
      ctx.font = btnFont + "px " + BODY_FONT;
      ctx.fillStyle = "#fff";
      ctx.fillText("OK", btnX2 + btnW2 / 2, btnY + L.buttonH / 2);
    }
  }

  function makeExportCanvas(bg) {
    var W = EXPORT_W;
    var H = EXPORT_H;
    var L = computeLayout(W, H, currentText());
    var canvas = document.createElement("canvas");
    canvas.width = W * EXPORT_SCALE;
    canvas.height = H * EXPORT_SCALE;
    var ctx = canvas.getContext("2d");
    ctx.scale(EXPORT_SCALE, EXPORT_SCALE);

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    if (bg && bg.base) drawCover(ctx, bg.base, W, H);
    if (bg && bg.vig) drawCover(ctx, bg.vig, W, H);
    drawCert(ctx, W, H, L);
    return canvas;
  }

  function exportPNG() {
    var btn = $("exportBtn");
    btn.disabled = true;
    ensureFont().then(getBgImages).then(function (bg) {
      try {
        var canvas = makeExportCanvas(bg);
        canvas.toBlob(function (blob) {
          if (!blob) throw new Error("toBlob returned null");
          download(blob, "tenhou-nintei-" + state.lang + "-" + (state.date || defaultDate).replace(/-/g, "") + ".png");
          btn.disabled = false;
        }, "image/png");
      } catch (err) {
        btn.disabled = false;
        alert(t("exportError") + err.message);
      }
    }).catch(function (err) {
      btn.disabled = false;
      alert(t("exportError") + (err && err.message ? err.message : err));
    });
  }

  function syncInputs() {
    $("nameInput").value = state.name;
    $("rankInput").value = state.rankText;
    $("dateInput").value = state.date;
    $("styleSelect").value = state.style;
    var radios = document.querySelectorAll('input[name="mode"]');
    Array.prototype.forEach.call(radios, function (r) { r.checked = (r.value === "three") === state.three; });
    $("vignetteChk").checked = state.vignette;
  }

  function bindEvents() {
    $("langSelect").addEventListener("change", function (e) {
      state.lang = e.target.value;
      applyUI();
      syncInputs();
      renderCert();
      showInstant();
    });

    $("nameInput").addEventListener("input", function (e) {
      state.name = e.target.value;
      renderCert();
      showInstant();
    });

    $("rankInput").addEventListener("input", function (e) {
      state.rankText = e.target.value;
      renderCert();
      showInstant();
    });

    $("dateInput").addEventListener("change", function (e) {
      state.date = e.target.value || defaultDate;
      renderCert();
      showInstant();
    });

    Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'), function (radio) {
      radio.addEventListener("change", function (e) {
        state.three = e.target.value === "three";
        renderCert();
        showInstant();
      });
    });

    $("styleSelect").addEventListener("change", function (e) {
      state.style = e.target.value === "v3" ? "v3" : "v4";
      renderCert();
      showInstant();
    });

    $("uploadBgBtn").addEventListener("click", function () { $("bgFile").click(); });
    $("bgFile").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (!/^image\//.test(file.type)) {
        alert(t("bgError") + file.name);
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        if (state.customBg && state.customBg.url !== url) URL.revokeObjectURL(state.customBg.url);
        state.customBg = { url: url, img: img, name: file.name };
        state.bgMode = "custom";
        buildSwatches();
        updateStageBg();
        updateBgName();
        renderCert();
        showInstant();
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        alert(t("bgError") + file.name);
      };
      img.src = url;
    });

    $("resetBgBtn").addEventListener("click", function () {
      if (state.customBg) {
        URL.revokeObjectURL(state.customBg.url);
        state.customBg = null;
      }
      state.bgMode = "preset";
      state.bgPreset = DEFAULT_BG;
      state.vignette = true;
      $("vignetteChk").checked = true;
      buildSwatches();
      updateStageBg();
      updateBgName();
      renderCert();
      showInstant();
    });

    $("vignetteChk").addEventListener("change", function (e) {
      state.vignette = e.target.checked;
      updateStageBg();
    });

    $("replayBtn").addEventListener("click", playFade);
    $("exportBtn").addEventListener("click", exportPNG);
    $("certOk").addEventListener("click", function (e) { e.preventDefault(); });

    if (window.ResizeObserver) {
      var raf = null;
      new ResizeObserver(function () {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () { renderCert(); });
      }).observe(stage);
    }
  }

  function init() {
    var langSel = $("langSelect");
    LANGS.forEach(function (code) {
      var opt = document.createElement("option");
      opt.value = code;
      opt.textContent = LANG_LABEL[code];
      langSel.appendChild(opt);
    });

    applyUI();
    syncInputs();
    updateStageBg();
    renderCert();
    bindEvents();
    setTimeout(playFade, 100);

    ensureFont().then(function () {
      renderCert();
    });
  }

  // 供调试 / 自动化测试使用
  window.__tenhouNintei = {
    render: renderCert,
    exportDataURL: function () {
      return ensureFont().then(getBgImages).then(function (bg) {
        return makeExportCanvas(bg).toDataURL("image/png");
      });
    },
    state: state,
    updateStageBg: updateStageBg
  };

  init();
})();
</script>
</body>
</html>
