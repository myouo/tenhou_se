<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天鳳 認定状ジェネレーター</title>
<meta name="description" content="Tenhou 認定状（昇段窗口）生成器：输入昵称、段位、日期，还原 tenhou.net 的「認定」窗口，支持官方 10 种语言与 PNG 导出。" />

<style>
  :root {
    --kai: "TenhouKai", "cwTeX Q Kai T", "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif;
    --bodyFont: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    --bg: #0b0d12;
    --panel: rgba(23, 26, 33, 0.88);
    --line: #262b36;
    --line-2: #303747;
    --text: #e8ebf2;
    --muted: #8f97a8;
    --muted-2: #767e90;
    --gold: #e3bd6d;
    --gold-2: #c79a42;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 700px at 18% -12%, #1c2233 0%, rgba(28, 34, 51, 0) 60%),
      radial-gradient(900px 600px at 110% 10%, #241d14 0%, rgba(36, 29, 20, 0) 55%),
      #080a0e;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 1380px;
    margin: 0 auto;
    padding: 26px 24px 34px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brandMark {
    flex: none;
    font-family: var(--kai);
    font-size: 28px;
    line-height: 1;
    padding: 11px 13px 12px;
    border: 1px solid #3a4050;
    border-radius: 12px;
    background: linear-gradient(180deg, #1c202b, #11141b);
    color: #f3e6c8;
    letter-spacing: 0.06em;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
  }
  .brandText { min-width: 0; }
  .brandText h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brandText p {
    margin: 5px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .langPick {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .langPick select { width: auto; min-width: 9.5em; min-height: 34px; padding: 6px 10px; }
  main {
    display: grid;
    grid-template-columns: 322px minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .panel {
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 19px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
  }
  .panel h2 {
    margin: 0 0 2px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #7f8798;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > span { font-size: 12.5px; color: #aab2c3; }
  input, select, button { font: inherit; }
  input[type="text"], input[type="date"], select {
    width: 100%;
    min-height: 38px;
    padding: 9px 11px;
    border: 1px solid #2b3140;
    border-radius: 9px;
    background: #0d1016;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, input[type="date"]:focus, select:focus {
    border-color: #b98d3e;
    box-shadow: 0 0 0 3px rgba(185, 141, 62, 0.16);
  }
  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid #2b3140;
    border-radius: 9px;
    background: #0d1016;
  }
  .seg label { position: relative; flex: 1; }
  .seg input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .seg span {
    display: block;
    padding: 7px 8px;
    border-radius: 6px;
    text-align: center;
    font-size: 13px;
    color: #98a1b3;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .seg input:checked + span {
    background: #262c39;
    color: #fff;
    box-shadow: inset 0 0 0 1px #3a4152;
  }
  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line-2);
    border-radius: 10px;
    background: #1a1f29;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, filter 0.15s, transform 0.05s;
  }
  .btn:hover { background: #222838; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(180deg, var(--gold), var(--gold-2));
    border-color: #8d6a26;
    color: #1a1305;
    font-weight: 650;
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.5; cursor: wait; filter: none; }
  .note { margin: 2px 0 0; font-size: 11.5px; line-height: 1.65; color: var(--muted-2); }
  .preview { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .previewHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9aa3b5;
  }
  .pill {
    padding: 4px 10px;
    border: 1px solid #2a3040;
    border-radius: 999px;
    background: #161a23;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: none;
    color: var(--muted);
  }
  .stageWrap {
    padding: 14px;
    border: 1px solid #242936;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(22, 25, 32, 0.9), rgba(12, 14, 19, 0.9));
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 10px;
    background: #000;
    box-shadow: inset 0 0 0 1px #1b1f27, 0 20px 60px rgba(0, 0, 0, 0.55);
  }
  .cert {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    color: #fff;
    text-align: center;
    font-family: var(--bodyFont);
    line-height: 1;
    opacity: 0;
    will-change: opacity;
  }
  .cert.style-v4 {
    padding: 1em 0;
    border: 1px solid #444;
    background: rgba(0, 0, 0, 0.9);
  }
  .cert.style-v3 {
    padding: 1em 0.5em;
    border: 1px solid #444;
    background: rgba(0, 0, 0, 0.85);
  }
  .cert .title {
    font-family: var(--kai);
    font-size: 400%;
    font-weight: 400;
    line-height: 1;
  }
  /* 标题 margin 在 JS 中按基础字号写 px（本家 n[4].style.margin = 2*b / 3*b） */
  .cert .bodyWrap { margin: 0; }
  .cert.style-v4 .bodyWrap { margin: 2em 0.5em 1em; }
  .cert .bodyText {
    display: inline-block;
    margin: 1em 0;
    vertical-align: top;
    text-align: left;
  }
  .cert .line {
    height: 1em;
    line-height: 1;
    white-space: pre;
  }
  .cert .ok { margin: 0; font-family: var(--bodyFont); font-size: 1em; cursor: default; }
  .cert.style-v4 .ok {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 8em;
    height: 3em;
    border: 1px solid #444;
    color: #fff;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.7) 0%,
      rgba(107, 107, 107, 0.5) 50%,
      rgba(31, 31, 31, 0.5) 50%,
      rgba(0, 0, 0, 0.7) 100%
    );
    text-shadow: #000 -0.03em -0.03em 0, #000 -0.03em 0.03em 0, #000 0.03em -0.03em 0,
      #000 0.06em 0.06em 0;
  }
  .cert.style-v3 .ok {
    height: 2em;
    padding: 0 2em;
    border: 2px outset #d6d6d6;
    background: #efefef;
    color: #000;
  }
  .hint { margin: 0; font-size: 11.5px; color: var(--muted-2); }
  footer {
    padding-top: 15px;
    border-top: 1px solid #1e232d;
    font-size: 11.5px;
    color: #666f80;
    line-height: 1.6;
  }
  @media (max-width: 940px) {
    main { grid-template-columns: 1fr; }
    .panel { position: static; }
    .brandText p { display: none; }
  }
  @media (max-width: 560px) {
    .app { padding: 18px 14px 26px; }
    .actions { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brandMark">認定</span>
      <div class="brandText">
        <h1 id="appTitle">天鳳 認定状ジェネレーター</h1>
        <p id="appSub">tenhou.net の「認定」昇段ウィンドウを再現</p>
      </div>
    </div>
    <label class="langPick">
      <span id="langLabel">言語</span>
      <select id="langSelect" aria-label="Language"></select>
    </label>
  </header>

  <main>
    <section class="panel" aria-labelledby="ctrlTitle">
      <h2 id="ctrlTitle">設定</h2>

      <label class="field">
        <span id="lblName">名前</span>
        <input id="nameInput" type="text" maxlength="24" autocomplete="off" spellcheck="false" value="NoName" />
      </label>

      <label class="field">
        <span id="lblRank">段位</span>
        <select id="rankSelect"></select>
      </label>

      <label class="field">
        <span id="lblDate">日付</span>
        <input id="dateInput" type="date" />
      </label>

      <div class="field">
        <span id="lblMode">対局</span>
        <div class="seg" role="radiogroup" aria-labelledby="lblMode">
          <label>
            <input type="radio" name="mode" value="four" checked />
            <span id="lblFour">四麻</span>
          </label>
          <label>
            <input type="radio" name="mode" value="three" />
            <span id="lblThree">三麻</span>
          </label>
        </div>
      </div>

      <label class="field">
        <span id="lblStyle">クライアント</span>
        <select id="styleSelect">
          <option value="v4" id="optV4">/4/</option>
          <option value="v3" id="optV3">/3/</option>
        </select>
      </label>

      <div class="actions">
        <button id="replayBtn" class="btn ghost" type="button">アニメを再生</button>
        <button id="exportBtn" class="btn primary" type="button">PNG 書き出し</button>
      </div>

      <p class="note" id="note"></p>
    </section>

    <section class="preview">
      <div class="previewHead">
        <span id="lblPreview">プレビュー</span>
        <span class="pill" id="fadeHint">3.0s fade-in</span>
      </div>
      <div class="stageWrap">
        <div class="stage" id="stage">
          <div class="cert style-v4" id="cert">
            <div class="title" id="certTitle">認定</div>
            <div class="bodyWrap"><div class="bodyText" id="certBody"></div></div>
            <button class="ok" id="certOk" type="button" tabindex="-1">OK</button>
          </div>
        </div>
      </div>
      <p class="hint" id="exportHint"></p>
    </section>
  </main>

  <footer id="disclaimer"></footer>
</div>

    var y = parts[0] || "2020";

    var dan = RANKS[state.rank] || RANKS[0];

  function measure(text, font) {
    measureCtx.font = font;
    return measureCtx.measureText(text).width;
  }

  var CJK_RE = /[　-ヿ㐀-䶿一-鿿豈-﫿＀-￯]/;

  function wrapLine(text, maxW, font) {
    measureCtx.font = font;
    if (!text || measureCtx.measureText(text).width <= maxW) return [text];

    var tokens = [];
    var buf = "";
    Array.from(text).forEach(function (ch) {
      if (CJK_RE.test(ch) || /\s/.test(ch)) {
        if (buf) { tokens.push(buf); buf = ""; }
        tokens.push(ch);
      } else {
        buf += ch;
      }
    });
    if (buf) tokens.push(buf);

    var out = [];
    var cur = "";
    function push(s) {
      var trimmed = s.replace(/\s+$/, "");
      if (trimmed) out.push(trimmed);
    }
    tokens.forEach(function (tok) {
      if (/\s/.test(tok)) {
        if (cur && measureCtx.measureText(cur + tok).width > maxW) {
          push(cur); cur = "";
        } else if (cur) {
          cur += tok;
        }
        return;
      }
      if (measureCtx.measureText(cur + tok).width <= maxW) {
        cur += tok;
        return;
      }
      if (cur) { push(cur); cur = ""; }
      if (measureCtx.measureText(tok).width <= maxW) {
        cur = tok;
        return;
      }
      Array.from(tok).forEach(function (ch) {
        if (cur && measureCtx.measureText(cur + ch).width > maxW) {
          push(cur); cur = ch;
        } else {
          cur += ch;
        }
      });
    });
    if (cur) push(cur);
    return out.length ? out : [text];

  function computeLayout(stageW, text) {
    var em = stageW * 0.02;
    var v4 = state.style === "v4";
    var bodyFont = em + "px " + BODY_FONT;
    var rawLines = text.split("\n");
    var maxLine = 0;
    rawLines.forEach(function (line) {
      maxLine = Math.max(maxLine, measure(line, bodyFont));

    var border = 1;
    var natural = maxLine + em + border * 2;
    var maxW = stageW * 0.98;
    var minW = v4 ? stageW * 0.70 : 0;
    var cardW = Math.min(Math.max(natural, minW), maxW);
    var contentW = Math.max(cardW - em - border * 2, em * 4);
    var bodyW = Math.min(maxLine, contentW);

    var lines = [];
    rawLines.forEach(function (line) {
      if (!line) { lines.push(""); return; }
      wrapLine(line, bodyW, bodyFont).forEach(function (l) { lines.push(l); });

    var titleH = 4 * em;
    var padT = em;
    var padB = em;
    var titleMt = v4 ? 2 * em : 0;
    var titleMb = v4 ? 3 * em : 0;
    var wrapMt = v4 ? 2 * em : 0;
    var innerMt = em;
    var innerMb = em;
    var wrapMb = v4 ? em : 0;
    var buttonH = v4 ? 3 * em : 2 * em;
    var bodyH = lines.length * em;

    var bodyTop = padT + titleMt + titleH + Math.max(titleMb, wrapMt) + innerMt;

    var cardH = buttonTop + buttonH + padB + border * 2;

    var btnW = v4 ? 8 * em : measure("OK", em + "px " + BODY_FONT) + 4 * em;
    var btnX = innerX + (L.cardW - btnW) / 2;
    var btnY = innerY + L.buttonTop;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (v4) {
      var grad = ctx.createLinearGradient(0, btnY, 0, btnY + L.buttonH);
      grad.addColorStop(0, "rgba(0,0,0,0.7)");
      grad.addColorStop(0.5, "rgba(107,107,107,0.5)");
      grad.addColorStop(0.5, "rgba(31,31,31,0.5)");
      grad.addColorStop(1, "rgba(0,0,0,0.7)");
      ctx.fillStyle = grad;
      ctx.fillRect(btnX, btnY, btnW, L.buttonH);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      ctx.strokeRect(btnX + 0.5, btnY + 0.5, btnW - 1, L.buttonH - 1);
      ctx.font = em + "px " + BODY_FONT;
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#000";
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 1;
      ctx.shadowBlur = 1;
      ctx.fillText("OK", btnX + btnW / 2, btnY + L.buttonH / 2);
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    } else {
      ctx.fillStyle = "#efefef";
      ctx.fillRect(btnX, btnY, btnW, L.buttonH);
      ctx.strokeStyle = "#999";
      ctx.lineWidth = 1;
      ctx.strokeRect(btnX + 0.5, btnY + 0.5, btnW - 1, L.buttonH - 1);
      ctx.font = em + "px " + BODY_FONT;
      ctx.fillStyle = "#000";
      ctx.fillText("OK", btnX + btnW / 2, btnY + L.buttonH / 2);
    }
  }

  function makeExportCanvas() {
    var W = EXPORT_W;
    var H = EXPORT_H;
    var L = computeLayout(W, currentText());
    var canvas = document.createElement("canvas");
    canvas.width = W * EXPORT_SCALE;
    canvas.height = H * EXPORT_SCALE;
    var ctx = canvas.getContext("2d");
    ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
    drawCert(ctx, W, H, L);
    return canvas;
  }

  function exportPNG() {
    var btn = $("exportBtn");
    btn.disabled = true;
    ensureFont().then(function () {
      try {
        var canvas = makeExportCanvas();
        canvas.toBlob(function (blob) {
          if (!blob) throw new Error("toBlob returned null");
          download(blob, "tenhou-nintei-" + state.lang + "-" + (state.date || defaultDate).replace(/-/g, "") + ".png");
          btn.disabled = false;
        }, "image/png");
      } catch (err) {
        btn.disabled = false;
        alert(t("exportError") + err.message);
      }
    }).catch(function (err) {
      btn.disabled = false;
      alert(t("exportError") + (err && err.message ? err.message : err));
    });
  }

  function bindEvents() {
    $("langSelect").addEventListener("change", function (e) {
      state.lang = e.target.value;
      applyUI();
      syncInputs();
      renderCert();
      showInstant();
    });

    $("nameInput").addEventListener("input", function (e) {
      state.name = e.target.value;
      renderCert();
      showInstant();
    });

    $("rankSelect").addEventListener("change", function (e) {
      state.rank = Number(e.target.value) || 0;
      renderCert();
      showInstant();
    });

    $("dateInput").addEventListener("change", function (e) {
      state.date = e.target.value || defaultDate;
      renderCert();
      showInstant();
    });

    document.querySelectorAll('input[name="mode"]').forEach(function (radio) {
      radio.addEventListener("change", function (e) {
        state.three = e.target.value === "three";
        renderCert();
        showInstant();
      });
    });

    $("styleSelect").addEventListener("change", function (e) {
      state.style = e.target.value === "v3" ? "v3" : "v4";
      renderCert();
      showInstant();
    });

    $("replayBtn").addEventListener("click", playFade);
    $("exportBtn").addEventListener("click", exportPNG);
    $("certOk").addEventListener("click", function (e) { e.preventDefault(); });

    if (window.ResizeObserver) {
      var raf = null;
      new ResizeObserver(function () {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () {
          renderCert();
        });
      }).observe(stage);
    }
  }

  function init() {
    var langSel = $("langSelect");
    LANGS.forEach(function (code) {
      var opt = document.createElement("option");
      opt.value = code;
      opt.textContent = LANG_LABEL[code];
      langSel.appendChild(opt);
    });

    applyUI();
    syncInputs();
    renderCert();
    bindEvents();
    setTimeout(playFade, 100);

    ensureFont().then(function () {
      renderCert();
    });
  }

  // 供调试 / 自动化测试使用
  window.__tenhouNintei = {
    render: renderCert,
    exportDataURL: function () {
      return ensureFont().then(function () {
        return makeExportCanvas().toDataURL("image/png");
      });
    },
    state: state
  };

  init();
})();
</script>
</body>
</html>
